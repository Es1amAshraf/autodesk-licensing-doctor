name: CI

# Fast sanity checks on every push / pull request:
#   - every PowerShell file parses
#   - PSScriptAnalyzer reports no errors
#   - the test suite passes (preview purity, backup/UNDO, report validity)
#   - the SignPath artifact configurations are well-formed
#   - the build script is present and self-consistent
#
# The heavier "build + sign + publish" flow lives in release-sign.yml.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count) {
              $bad++
              Write-Host "::error file=$($_.FullName)::$($errors.Count) parse error(s)"
              $errors | ForEach-Object { Write-Host "    $($_.Message)" }
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($bad) { throw "$bad file(s) failed to parse" }

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $res = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($res) {
            $res | Format-Table -AutoSize
            throw "$($res.Count) PSScriptAnalyzer error(s)"
          }
          Write-Host "No analyzer errors."

      - name: Unit tests (Pester)
        shell: pwsh
        run: |
          # The suite launches the toolkit with Windows PowerShell 5.1 (that is
          # what the released exe runs on), and the checks that touch Program
          # Files / ProgramData run because a runner is elevated - a developer
          # shell skips them.
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
            Install-Module Pester -Scope CurrentUser -MinimumVersion 5.0.0 -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = '.\tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) test(s) failed" }
          Write-Host "$($r.PassedCount) test(s) passed, $($r.SkippedCount) skipped."

      - name: Build the release (dry run)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module ps2exe -Scope CurrentUser -Force
          # The build compiles the app exe with Windows PowerShell 5.1 on purpose
          # (a 5.1-based exe runs on a stock Windows 10/11, a PowerShell 7 build
          # would need PowerShell 7 on the client machine), so ps2exe has to be
          # installed for that host too: "Install-Module -Scope CurrentUser" under
          # pwsh lands in Documents\PowerShell\Modules, which 5.1 never looks at.
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue; Install-Module ps2exe -Scope CurrentUser -Force"
          choco install innosetup -y --no-progress
          # A throwaway version: it builds into releases\v0.0.0 and is never
          # published. This is the same script the release workflow runs, so a
          # broken exe, archive or installer fails here instead of at release time.
          .\Build-Release.ps1 -Version 0.0.0 -Recompile -Notes 'Dry run (CI)'
          $expected = @(
            'UNLOCK-DIGITAL-AdskDoctor.exe',
            'releases\v0.0.0\AdskDoctor-v0.0.0-Project.zip',
            'releases\v0.0.0\AdskDoctor-v0.0.0-Portable.zip',
            'releases\v0.0.0\UNLOCK-DIGITAL-AdskDoctor-Setup-0.0.0.exe'
          )
          foreach ($f in $expected) {
            if (-not (Test-Path -LiteralPath $f)) { throw "the build produced no $f" }
          }
          Write-Host 'The exe, both archives and the installer all build.'

      - name: Validate SignPath artifact configurations
        shell: pwsh
        run: |
          $files = Get-ChildItem .signpath\*.xml -ErrorAction SilentlyContinue
          if (-not $files) { throw "No artifact configurations found in .signpath/" }
          foreach ($f in $files) {
            try {
              [xml]$x = Get-Content $f -Raw
              if ($x.DocumentElement.LocalName -ne 'artifact-configuration') { throw "unexpected root element" }
              Write-Host "OK   $($f.Name)"
            } catch {
              Write-Host "::error file=$($f.FullName)::$($_.Exception.Message)"
              throw
            }
          }

      - name: Verify build script inputs
        shell: pwsh
        run: |
          $required = @(
            'Build-Release.ps1', 'AdskDoctor-GUI.ps1', 'AdskDoctor.ps1', 'Backup.ps1',
            'Clean.ps1', 'Repair.ps1', 'AdskDoctor.ico', 'unlock-logo.ico',
            'make-logo-icon.ps1', 'installer\AdskDoctor.iss', 'LICENSE', 'README.md',
            'CODE-SIGNING.md', 'PRIVACY.md'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing) { throw ("Missing required file(s): " + ($missing -join ', ')) }
          Write-Host "All required build inputs are present."
